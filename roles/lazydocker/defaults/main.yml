---
# Default variables for lazydocker role

# lazydocker_version: Version to install from GitHub releases
lazydocker_version: "0.25.2"

# lazydocker_install_path: Path where the binary will be installed
lazydocker_install_path: "/usr/local/bin"

# lazydocker_download_dir: Directory the archive is downloaded to.
# The role never creates or chmods this directory, so /tmp is safe.
lazydocker_download_dir: "/tmp"

# lazydocker_arch_map: Architecture mappings (ansible_architecture -> release suffix)
lazydocker_arch_map:
  x86_64: Linux_x86_64
  aarch64: Linux_arm64
