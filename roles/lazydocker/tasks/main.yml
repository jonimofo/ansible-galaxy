---
# tasks file for roles/lazydocker

- name: Verify Debian-based system
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "This role only supports Debian-based systems (Debian, Ubuntu)"
    quiet: true

- name: Verify supported architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in lazydocker_arch_map
    fail_msg: "Unsupported architecture: {{ ansible_architecture }}. Supported: {{ lazydocker_arch_map.keys() | list }}"
    quiet: true

- name: Set lazydocker download facts
  ansible.builtin.set_fact:
    _lazydocker_archive: "lazydocker_{{ lazydocker_version }}_{{ lazydocker_arch_map[ansible_architecture] }}.tar.gz"

- name: Check if lazydocker binary exists
  ansible.builtin.stat:
    path: "{{ lazydocker_install_path }}/lazydocker"
  register: lazydocker_binary

# No mkdir/chmod on lazydocker_download_dir on purpose: with the default /tmp
# that would strip the sticky bit and break SSH agent forwarding.
- name: Download and install lazydocker
  when: not lazydocker_binary.stat.exists
  block:
    - name: Download lazydocker archive
      ansible.builtin.get_url:
        url: >-
          https://github.com/jesseduffield/lazydocker/releases/download/v{{
          lazydocker_version }}/{{ _lazydocker_archive }}
        dest: "{{ lazydocker_download_dir }}/{{ _lazydocker_archive }}"
        mode: "0644"
        force: false

    - name: Extract lazydocker binary
      ansible.builtin.unarchive:
        src: "{{ lazydocker_download_dir }}/{{ _lazydocker_archive }}"
        dest: "{{ lazydocker_install_path }}"
        remote_src: true
        include: [lazydocker]
        owner: root
        group: root

    - name: Clean up archive
      ansible.builtin.file:
        path: "{{ lazydocker_download_dir }}/{{ _lazydocker_archive }}"
        state: absent

- name: Ensure lazydocker binary is executable and owned by root
  ansible.builtin.file:
    path: "{{ lazydocker_install_path }}/lazydocker"
    owner: root
    group: root
    mode: "0755"

# Older runs extracted the whole archive into the install path
- name: Remove archive extras from the install path
  ansible.builtin.file:
    path: "{{ lazydocker_install_path }}/{{ item }}"
    state: absent
  loop:
    - LICENSE
    - README.md
