---
# handlers file for roles/host

# Validate before applying, same pattern as the ssh role (sshd -t).
# No native module exists for netplan, so command is the sanctioned tool here.
- name: Validate netplan config
  ansible.builtin.command:
    cmd: netplan generate
  changed_when: false
  listen: "Apply netplan"

- name: Apply netplan
  ansible.builtin.command:
    cmd: netplan apply
  changed_when: true
  listen: "Apply netplan"

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
