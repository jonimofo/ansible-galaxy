---
- name: Verify Debian-based system
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "This role only supports Debian-based systems (Debian, Ubuntu)"
    quiet: true

# --- Install Neovim ---

# git: clones the AstroNvim template. gcc: nvim-treesitter compiles its parsers. unzip: mason extracts its tools.
- name: Install Neovim plugin build dependencies
  ansible.builtin.apt:
    name: "{{ astronvim_build_packages }}"
    state: present

- name: Verify supported architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in astronvim_neovim_arch_map
    fail_msg: >-
      Unsupported architecture: {{ ansible_architecture }}.
      Supported: {{ astronvim_neovim_arch_map.keys() | list }}
    quiet: true

- name: Determine Neovim archive name based on architecture
  ansible.builtin.set_fact:
    astronvim_neovim_archive_name: "nvim-linux-{{ astronvim_neovim_arch_map[ansible_architecture] }}.tar.gz"

- name: Check if Neovim is already installed
  ansible.builtin.stat:
    path: "{{ astronvim_neovim_binary_path }}"
  register: astronvim_nvim_binary_stat

- name: Read the installed Neovim version
  ansible.builtin.command:
    cmd: "{{ astronvim_neovim_binary_path }} --version"
  register: _astronvim_nvim_version_output
  changed_when: false
  failed_when: false
  check_mode: false
  when: astronvim_nvim_binary_stat.stat.exists

# A missing binary or a version other than the pin triggers a (re)install.
# The first line reads "NVIM v0.12.6".
- name: Decide whether Neovim needs installing
  ansible.builtin.set_fact:
    _astronvim_nvim_needs_install: >-
      {{ not astronvim_nvim_binary_stat.stat.exists
         or (_astronvim_nvim_version_output.stdout | default('')
             | regex_findall('^NVIM +(\S+)', multiline=true) | first | default(''))
            != astronvim_neovim_version }}

# The archive is fetched into a fresh root-only directory (mktemp under
# astronvim_download_dir): a predictable path in /tmp could be planted by a
# local user and extracted as root into /usr/local.
- name: Install Neovim {{ astronvim_neovim_version }}
  when: _astronvim_nvim_needs_install | bool
  block:
    - name: Create a private download directory
      ansible.builtin.tempfile:
        state: directory
        path: "{{ astronvim_download_dir }}"
        suffix: neovim
      register: _astronvim_tmp

    - name: Download Neovim tarball for version {{ astronvim_neovim_version }}
      ansible.builtin.get_url:
        url: "{{ astronvim_neovim_download_url }}/{{ astronvim_neovim_version }}/{{ astronvim_neovim_archive_name }}"
        dest: "{{ _astronvim_tmp.path }}/{{ astronvim_neovim_archive_name }}"
        mode: "0644"
        force: false

    # The archive extracts over /usr/local: drop the previous runtime so files
    # removed upstream do not linger next to the new version
    - name: Remove the previous Neovim runtime
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/lib/nvim
        - /usr/local/share/nvim
      when: astronvim_nvim_binary_stat.stat.exists

    - name: Extract Neovim archive into /usr/local/
      ansible.builtin.unarchive:
        src: "{{ _astronvim_tmp.path }}/{{ astronvim_neovim_archive_name }}"
        dest: "/usr/local/"
        # --no-same-owner: root would otherwise keep the UID stored in the
        # archive, which also applies to /usr/local/{bin,lib,share} themselves
        extra_opts: [--strip-components=1, --no-same-owner]
        remote_src: true
  always:
    - name: Remove the private download directory
      ansible.builtin.file:
        path: "{{ _astronvim_tmp.path }}"
        state: absent
      when: _astronvim_tmp.path is defined

# Older runs extracted with the archive owner: give Neovim's files back to root
- name: Ensure Neovim files in /usr/local belong to root
  ansible.builtin.command:
    cmd: >-
      find {{ astronvim_neovim_binary_path }} /usr/local/lib/nvim /usr/local/share/nvim
      ! -user root -print -exec chown -h root:root {} +
  register: astronvim_chown
  changed_when: astronvim_chown.stdout | length > 0

# --- Configure AstroNvim per user ---

- name: Configure AstroNvim for each user
  ansible.builtin.include_tasks: setup_user.yml
  vars:
    _astronvim_home: "{{ user.home | default('/home/' ~ user.name) }}"
  loop: "{{ astronvim_users }}"
  loop_control:
    loop_var: user
    label: "{{ user.name }}"
  when: astronvim_users | length > 0
