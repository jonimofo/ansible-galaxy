---
- name: "Check if AstroNvim is already installed for {{ user.name }}"
  ansible.builtin.stat:
    path: "{{ _astronvim_home }}/.local/share/nvim/lazy/lazy.nvim"
  register: astronvim_install_stat
  become: true
  become_user: "{{ user.name }}"

- name: "Check for existing directories to backup for {{ user.name }}"
  ansible.builtin.stat:
    path: "{{ _astronvim_home }}/{{ item }}"
  loop:
    - ".config/nvim"
    - ".local/share/nvim"
    - ".local/state/nvim"
    - ".cache/nvim"
  register: astronvim_existing_paths
  when: not astronvim_install_stat.stat.exists
  become: true
  become_user: "{{ user.name }}"

- name: "Set up AstroNvim for {{ user.name }}"
  become: true
  become_user: "{{ user.name }}"
  when: not astronvim_install_stat.stat.exists
  block:
    - name: "Backup existing Neovim directories"
      ansible.builtin.command:
        cmd: "mv {{ item.stat.path }} {{ item.stat.path }}.bak"
        removes: "{{ item.stat.path }}"
      loop: "{{ astronvim_existing_paths.results }}"
      when: item.stat.exists
      changed_when: true

    - name: "Clone AstroNvim template"
      ansible.builtin.git:
        repo: "https://github.com/AstroNvim/template"
        dest: "{{ _astronvim_home }}/.config/nvim"
        version: main
        depth: 1

    - name: "Remove .git directory from AstroNvim clone"
      ansible.builtin.file:
        path: "{{ _astronvim_home }}/.config/nvim/.git"
        state: absent

    # Plugins are otherwise installed on first launch: until then lazy.nvim is
    # missing and the next run would back up and re-clone the config.
    - name: "Install AstroNvim plugins"
      ansible.builtin.command:
        cmd: nvim --headless "+Lazy! sync" +qa
        chdir: "{{ _astronvim_home }}"
        creates: "{{ _astronvim_home }}/.local/share/nvim/lazy/lazy.nvim"
