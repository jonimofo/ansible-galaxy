---
# defaults file for roles/astronvim

# --- Neovim Installation ---

# astronvim_neovim_binary_path: Path where nvim binary will be installed
astronvim_neovim_binary_path: "/usr/local/bin/nvim"

# astronvim_neovim_download_url: Base URL for Neovim releases
astronvim_neovim_download_url: "https://github.com/neovim/neovim/releases/download"

# astronvim_neovim_version: Neovim version to install
astronvim_neovim_version: "v0.12.6"

# astronvim_download_dir: Parent of the private (mktemp) download directory
astronvim_download_dir: "/tmp"

# astronvim_neovim_arch_map: ansible_architecture -> Neovim release suffix
astronvim_neovim_arch_map:
  x86_64: x86_64
  aarch64: arm64

# astronvim_build_packages: Packages needed to clone the config and build plugins
astronvim_build_packages:
  - git
  - gcc
  - unzip

# --- User Configuration ---

# astronvim_users: List of users to configure AstroNvim for
# Each user has a 'name' key and an optional 'home' (default /home/<name>)
astronvim_users: []
# Example:
#   - name: "admin"
#   - name: "developer"
#     home: "/srv/developer"
