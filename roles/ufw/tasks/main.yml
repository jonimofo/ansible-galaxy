---
# tasks file for roles/ufw

- name: Verify Debian-based system
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "This role only supports Debian-based systems (Debian, Ubuntu)"
    quiet: true

- name: Ensure UFW is installed
  ansible.builtin.apt:
    name: "{{ ufw_pkg_name }}"
    state: present

- name: Configure IPv6 support
  ansible.builtin.lineinfile:
    path: "{{ ufw_config_path }}"
    regexp: '^IPV6='
    line: "IPV6={{ ufw_enable_ipv6 | ternary('yes', 'no') }}"
    state: present
  notify: Reload ufw

- name: Reset UFW to default settings
  community.general.ufw:
    state: reset
  when: ufw_reset_before_configure | bool

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop: "{{ ufw_default_policies }}"
  loop_control:
    label: "{{ item.direction }}: {{ item.policy }}"

- name: Configure UFW rules
  community.general.ufw:
    rule: "{{ item.rule }}"
    name: "{{ item.name | default(omit) }}"
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    comment: "{{ item.comment | default(omit) }}"
    from_ip: "{{ item.from_ip | default(omit) }}"
    to_ip: "{{ item.to_ip | default(omit) }}"
    interface: "{{ item.interface | default(omit) }}"
    direction: "{{ item.direction | default(omit) }}"
  loop: "{{ ufw_rules }}"
  loop_control:
    label: >-
      {{ item.rule }} {{ item.name | default(item.port | default('')) }}{{
      item.from_ip | default('') | ternary(' from ' ~ item.from_ip | default(''), '') }}
  when: ufw_rules | length > 0

- name: Set UFW logging level
  community.general.ufw:
    logging: "{{ ufw_logging }}"

# Lockout guard: never enable a deny-incoming firewall without a rule for
# the port we verify (the SSH port). New sessions would be dropped while the
# current one survives through conntrack, and the post-check could only
# report the lockout.
- name: Assert a rule allows port {{ ufw_verify_port }} before enabling
  ansible.builtin.assert:
    that: >-
      (ufw_verify_port | string) in (ufw_rules | selectattr('rule', 'in', ['allow', 'limit'])
                                      | selectattr('port', 'defined') | map(attribute='port')
                                      | map('string') | list)
      or 'OpenSSH' in (ufw_rules | selectattr('name', 'defined') | map(attribute='name') | list)
    fail_msg: >-
      ufw_rules has no allow/limit rule for port {{ ufw_verify_port }} (or the OpenSSH profile).
      Add one, or set ufw_verify_port to 0 if this host really has no SSH.
    quiet: true
  when:
    - ufw_state == 'enabled'
    - ufw_verify_port | int > 0

- name: Ensure UFW is {{ ufw_state }}
  community.general.ufw:
    state: "{{ ufw_state }}"

# Post-check: a wrong rule set must fail the play, not lock us out silently
- name: Verify port {{ ufw_verify_port }} is still reachable from the control node
  ansible.builtin.wait_for:
    port: "{{ ufw_verify_port | int }}"
    host: "{{ ansible_host | default(inventory_hostname) }}"
    timeout: "{{ ufw_verify_timeout }}"
  delegate_to: localhost
  become: false
  when:
    - ufw_state == 'enabled'
    - ufw_verify_port | int > 0
    - ansible_connection | default('ssh') != 'local'
