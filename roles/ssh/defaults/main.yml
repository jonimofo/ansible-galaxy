---
# defaults file for roles/ssh

# --- Where the hardening lands ---

# ssh_dropin_name: Drop-in file in /etc/ssh/sshd_config.d (00- sorts first, so it wins)
ssh_dropin_name: 00-ansible.conf

# ssh_service_name: Service to reload (ssh on Debian and Ubuntu)
ssh_service_name: ssh

# ssh_verify_port: After reloading sshd, check ssh_port still answers from the
# control node, then reset the connection and open a new session (lockout
# guard). Skipped on local connections.
ssh_verify_port: true

# ssh_verify_timeout: Seconds to wait for ssh_port in the lockout guard
ssh_verify_timeout: 10

# --- SSH Daemon Settings ---

# ssh_port: SSH daemon listening port
ssh_port: 22

# ssh_permit_root_login: Allow root login via SSH
# Values: "yes", "no", "prohibit-password", "forced-commands-only"
ssh_permit_root_login: "no"

# ssh_pubkey_authentication: Allow public key authentication
ssh_pubkey_authentication: true

# ssh_password_authentication: Allow password-based authentication
ssh_password_authentication: false

# ssh_permit_empty_passwords: Allow empty passwords
ssh_permit_empty_passwords: false

# ssh_max_auth_tries: Maximum authentication attempts per connection
ssh_max_auth_tries: 3

# ssh_login_grace_time: Time in seconds to authenticate before disconnect
ssh_login_grace_time: 60

# ssh_max_sessions: Maximum sessions per network connection
ssh_max_sessions: 2

# --- Forwarding Settings ---

# ssh_allow_agent_forwarding: Allow SSH agent forwarding (needed by the dotfiles role)
ssh_allow_agent_forwarding: false

# ssh_allow_tcp_forwarding: Allow TCP port forwarding
ssh_allow_tcp_forwarding: false

# ssh_x11_forwarding: Allow X11 forwarding
ssh_x11_forwarding: false

# --- Client Keep-Alive ---

# ssh_client_alive_interval: Seconds before sending keep-alive to client
ssh_client_alive_interval: 300

# ssh_client_alive_count_max: Keep-alive messages before disconnect
ssh_client_alive_count_max: 2

# --- Client Configuration ---

# ssh_strict_host_key_checking: StrictHostKeyChecking for ssh_config
# Values: "yes", "no", "ask"
ssh_strict_host_key_checking: "ask"

# --- User Access ---

# ssh_users: List of users allowed to SSH (AllowUsers) with their public keys.
# Each user requires `name` and one key source, resolved in this order:
#   pubkey: inline public key (one or several lines)
#   pubkey_file: path on the control node to a .pub file
#   otherwise: <ssh_public_keys_dir>/<name>.pub when ssh_public_keys_dir is set
ssh_users: []
# Example:
# ssh_users:
#   - name: "alice"
#     pubkey: "ssh-ed25519 AAAA... alice@example.com"
#   - name: "bob"
#     pubkey_file: "{{ inventory_dir }}/files/ssh/bob.pub"
#   - name: "deploy"   # read from ssh_public_keys_dir/deploy.pub

# ssh_allow_users_extra: User names added to AllowUsers without managing their
# account or authorized_keys (keys are managed elsewhere, e.g. by an
# application role). Names already in ssh_users are not repeated.
ssh_allow_users_extra: []
# Example:
# ssh_allow_users_extra:
#   - "deploy"

# ssh_public_keys_dir: Directory on the control node holding one <name>.pub per
# user without pubkey/pubkey_file. Empty disables the lookup.
ssh_public_keys_dir: ""

# ssh_exclusive_keys: Remove unmanaged keys from authorized_keys
# When true: authorized_keys will contain ONLY keys defined in ssh_users
# When false: keys from ssh_users are added, existing keys are kept
# WARNING: With true, any key not in ssh_users will be removed on next run
ssh_exclusive_keys: true

# --- Additional Hardening ---

# ssh_print_motd: Display /etc/motd on login
ssh_print_motd: false

# ssh_print_last_log: Display last login info
ssh_print_last_log: true

# ssh_use_dns: DNS lookup for connecting hosts (disable for speed)
ssh_use_dns: false

# ssh_accept_env: Environment variables to accept from client
ssh_accept_env: "LANG LC_*"
