---
# tasks file for roles/packages

- name: Verify Debian-based system
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "This role only supports Debian-based systems (Debian, Ubuntu)"
    quiet: true

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ packages_apt_update_packages_to_install }}"
    state: present
  when: packages_apt_update_packages_to_install | length > 0

- name: Remove obsolete files from tools installed outside apt
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ packages_obsolete_paths }}"

- name: Remove unused dependencies (apt autoremove)
  ansible.builtin.apt:
    autoremove: true
  # Destructive op, opt-in only. Default off so the role stays idempotent
  # on a converged host. Enable with: -e packages_run_cleanup=true
  when: packages_run_cleanup | bool

- name: Clean apt package cache (autoclean)
  ansible.builtin.apt:
    autoclean: true
  when: packages_run_cleanup | bool

# --- needrestart ---
- name: Install needrestart
  ansible.builtin.apt:
    name: needrestart
    state: present
  when: packages_needrestart_install | bool

- name: Configure needrestart to restart services automatically
  ansible.builtin.copy:
    content: |
      # Ansible managed - do not edit manually
      $nrconf{restart} = 'a';
    dest: /etc/needrestart/conf.d/50-ansible-auto.conf
    owner: root
    group: root
    mode: "0644"
  when: packages_needrestart_install | bool
  # the package (and its conf.d) is not installed yet in check mode on a fresh host
  ignore_errors: "{{ ansible_check_mode }}"

# --- Nightly APT service and timer ---
- name: Deploy APT update systemd service
  ansible.builtin.template:
    src: apt_update.service.j2
    dest: "{{ packages_apt_update_service_dest }}"
    owner: root
    group: root
    mode: "{{ packages_apt_update_service_mode }}"
  notify: Reload systemd

- name: Deploy APT update systemd timer
  ansible.builtin.template:
    src: apt_update.timer.j2
    dest: "{{ packages_apt_update_timer_dest }}"
    owner: root
    group: root
    mode: "{{ packages_apt_update_timer_mode }}"
  notify:
    - Reload systemd
    - Restart apt update timer

- name: Enable and start APT update timer
  ansible.builtin.systemd:
    name: "{{ packages_apt_update_timer_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  # the unit file is not written yet in check mode on a fresh host
  ignore_errors: "{{ ansible_check_mode }}"

- name: Disable and mask default APT systemd units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop: "{{ packages_apt_update_disable_units }}"
  notify: Reload systemd

# --- Security: Unattended Upgrades ---
- name: Configure unattended-upgrades
  when: packages_apt_update_unattended_upgrades | bool
  tags:
    - security
    - unattended-upgrades
  block:
    - name: Install unattended-upgrades package
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Deploy unattended-upgrades configuration
      ansible.builtin.template:
        src: 50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: "0644"

    - name: Deploy auto-upgrades configuration
      ansible.builtin.template:
        src: 20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"

    - name: Enable unattended-upgrades service
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true
        state: started
      # the package is not installed yet in check mode on a fresh host
      ignore_errors: "{{ ansible_check_mode }}"

- name: Disable unattended-upgrades when not configured
  when: not (packages_apt_update_unattended_upgrades | bool)
  tags:
    - security
    - unattended-upgrades
  block:
    - name: Check if unattended-upgrades is installed
      ansible.builtin.package_facts:
        manager: apt

    - name: Stop and disable unattended-upgrades service
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: false
        state: stopped
      when: "'unattended-upgrades' in ansible_facts.packages"
