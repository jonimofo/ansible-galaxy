---
# defaults file for roles/packages

# --- Packages ---

# packages_apt_update_packages_to_install: List of packages to install via apt
packages_apt_update_packages_to_install: []
# - git
# - vim
# - curl
# - ufw
# - fail2ban
# - colordiff
# - bat
# - lnav
# - fd-find
# - silversearcher-ag
# - jq
# - tree
# - eza
# - btop
# - tmux
# - zoxide

# packages_apt_cache_valid_time: Seconds the apt cache stays valid before the install
# task refreshes it, so a fresh host installs from current lists without a refresh on every run.
packages_apt_cache_valid_time: 3600

# packages_obsolete_paths: Files left by tools once installed outside apt, removed.
# fasd was built from source by a former role and is replaced by zoxide.
packages_obsolete_paths:
  - /usr/local/bin/fasd
  - /usr/local/share/man/man1/fasd.1

# packages_run_cleanup: Gate apt autoremove + autoclean behind an explicit opt-in.
# Unconditional cleanup is not idempotent (always "changed" when old kernels
# are pending removal) and can destroy manually-pinned packages. Routine
# kernel cleanup is handled by the nightly service and unattended-upgrades.
# Trigger cleanup explicitly with: -e packages_run_cleanup=true
packages_run_cleanup: false

# --- Nightly APT service and timer ---
# The stock apt-daily* timers run at random times and hold the dpkg lock
# (breaking Ansible runs). They are masked and replaced by apt_update.timer,
# which runs at a fixed time. What the service does depends on
# packages_apt_update_unattended_upgrades:
#   true  -> apt-get update, unattended-upgrade (security origins only),
#            autoremove, autoclean
#   false -> apt-get update, apt-get full-upgrade -y, autoremove, autoclean

# packages_apt_update_disable_units: Stock systemd units to disable and mask
packages_apt_update_disable_units:
  - apt-daily.timer
  - apt-daily-upgrade.timer
  - apt-daily.service
  - apt-daily-upgrade.service
packages_apt_update_service_dest: /etc/systemd/system/apt_update.service  # path of the service unit
packages_apt_update_service_mode: "0644"  # file mode of the service unit
# packages_apt_update_service_timeout_stop_sec: Seconds systemd waits when stopping the unit.
# Stopping the unit must not kill dpkg mid-upgrade, same as the stock apt-daily-upgrade.service.
packages_apt_update_service_timeout_stop_sec: 900
packages_apt_update_timer_dest: /etc/systemd/system/apt_update.timer  # path of the timer unit
packages_apt_update_timer_mode: "0644"  # file mode of the timer unit
packages_apt_update_timer_on_calendar: "*-*-* 03:00:00"  # systemd OnCalendar schedule
packages_apt_update_timer_persistent: true  # run at next boot if the time was missed
# packages_apt_update_timer_randomized_delay_sec: Random delay added to each run.
# Spreads a fleet over the mirror, keeps the run inside the maintenance window.
packages_apt_update_timer_randomized_delay_sec: "15m"
packages_apt_update_timer_unit: apt_update.timer  # name of the timer unit to enable

# --- Unattended upgrades (security patches only) ---

# packages_apt_update_unattended_upgrades: Install and configure unattended-upgrades
# and have the nightly service apply security patches with it.
packages_apt_update_unattended_upgrades: true

# packages_apt_update_unattended_origins: Origins-Pattern entries to auto-upgrade.
# Picked per distribution from packages_apt_update_unattended_origins_map;
# override the list directly if needed.
packages_apt_update_unattended_origins: >-
  {{ packages_apt_update_unattended_origins_map[ansible_distribution] | default([]) }}

# packages_apt_update_unattended_origins_map: Default security origins per distribution
packages_apt_update_unattended_origins_map:
  Debian:
    - "origin=Debian,codename=${distro_codename}-security,label=Debian-Security"
  Ubuntu:
    - "origin=Ubuntu,codename=${distro_codename}-security,label=Ubuntu"

# packages_apt_update_unattended_blacklist: Packages to never auto-upgrade
packages_apt_update_unattended_blacklist: []
# - docker-ce
# - linux-image

# packages_apt_update_unattended_autofix: Attempt to fix interrupted dpkg
packages_apt_update_unattended_autofix: true

# packages_apt_update_unattended_remove_unused: Auto-remove unused dependencies and kernels
packages_apt_update_unattended_remove_unused: true

# packages_apt_update_unattended_reboot: Auto-reboot when a patch requires it (use with caution)
packages_apt_update_unattended_reboot: false

# packages_apt_update_unattended_reboot_time: Time to reboot if auto-reboot enabled.
# After the 03:00 run, so a reboot does not wait 23 hours.
packages_apt_update_unattended_reboot_time: "03:30"

# packages_apt_update_unattended_mail: Email address for upgrade notifications (empty = disabled)
packages_apt_update_unattended_mail: ""

# packages_apt_update_unattended_mail_on_error: Only send mail on errors
packages_apt_update_unattended_mail_on_error: true

# --- needrestart ---

# packages_needrestart_install: Install needrestart in automatic mode so services
# using a patched library (openssl, glibc...) are restarted after an upgrade.
# Ubuntu ships it by default, Debian does not.
packages_needrestart_install: true
