---
# tasks file for roles/dotfiles

- name: Verify Debian-based system
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "This role only supports Debian-based systems (Debian, Ubuntu)"
    quiet: true

- name: Ensure git is installed
  ansible.builtin.apt:
    name: git
    state: present

# The clone runs as the connecting user (no become) so the forwarded SSH agent
# is used. Fail early and clearly when the agent or the remote is not reachable.
- name: Verify SSH agent forwarding is working
  ansible.builtin.command:
    cmd: ssh-add -l
  become: false
  changed_when: false
  register: dotfiles_ssh_agent_check
  failed_when: dotfiles_ssh_agent_check.rc != 0
  when:
    - dotfiles_verify_ssh_access | bool
    - dotfiles_user_configs.users | length > 0
    - dotfiles_user_configs.repo is match('^[^@]+@[^:]+:')

- name: Verify SSH access to the dotfiles remote via forwarded agent
  ansible.builtin.command:
    cmd: "ssh -o StrictHostKeyChecking=accept-new -T {{ dotfiles_remote_host }}"
  become: false
  changed_when: false
  vars:
    dotfiles_remote_host: "{{ dotfiles_user_configs.repo | regex_replace('^([^@]+@[^:]+):.*$', '\\1') }}"
  register: dotfiles_remote_ssh_check
  # GitHub and GitLab answer a greeting with rc 1 when there is no shell
  failed_when: dotfiles_remote_ssh_check.rc not in [0, 1]
  when:
    - dotfiles_verify_ssh_access | bool
    - dotfiles_user_configs.users | length > 0
    - dotfiles_user_configs.repo is match('^[^@]+@[^:]+:')

- name: Look for an existing dotfiles clone for {{ item.user }}
  ansible.builtin.stat:
    path: "{{ user_home }}/{{ dotfiles_user_configs.clone_dir }}/.git"
  become: "{{ item.user != ansible_user }}"
  become_user: "{{ item.user if item.user != ansible_user else omit }}"
  loop: "{{ dotfiles_user_configs.users }}"
  loop_control:
    label: "{{ item.user }}"
  vars:
    user_home: "{{ item.home | default('/home/' + item.user) }}"
  register: dotfiles_clone_git

# A shallow clone has a .git/shallow file; a full one carries the whole history
- name: Look for the shallow marker of the dotfiles clone for {{ item.item.user }}
  ansible.builtin.stat:
    path: "{{ item.stat.path }}/shallow"
  become: "{{ item.item.user != ansible_user }}"
  become_user: "{{ item.item.user if item.item.user != ansible_user else omit }}"
  loop: "{{ dotfiles_clone_git.results }}"
  loop_control:
    label: "{{ item.item.user }}"
  when: item.stat.exists
  register: dotfiles_clone_shallow

- name: Remove full dotfiles clone for {{ item.item.item.user }}
  ansible.builtin.file:
    path: "{{ user_home }}/{{ dotfiles_user_configs.clone_dir }}"
    state: absent
  become: true
  loop: "{{ dotfiles_clone_shallow.results }}"
  loop_control:
    label: "{{ item.item.item.user }}"
  vars:
    user_home: "{{ item.item.item.home | default('/home/' + item.item.item.user) }}"
  when:
    - item.stat is defined
    - not item.stat.exists

- name: Clone or update dotfiles repo for {{ item.user }}
  ansible.builtin.git:
    repo: "{{ dotfiles_user_configs.repo }}"
    dest: "{{ user_home }}/{{ dotfiles_user_configs.clone_dir }}"
    version: "{{ dotfiles_user_configs.version }}"
    update: true
    accept_newhostkey: true
    force: true
    depth: 1
    single_branch: true
  # Only use become when target user differs from ansible_user
  # This preserves SSH agent forwarding for the connecting user
  become: "{{ item.user != ansible_user }}"
  become_user: "{{ item.user if item.user != ansible_user else omit }}"
  loop: "{{ dotfiles_user_configs.users }}"
  loop_control:
    label: "{{ item.user }}"
  vars:
    user_home: "{{ item.home | default('/home/' + item.user) }}"

- name: Check dotfiles sources exist in the clone
  ansible.builtin.stat:
    path: "{{ user_home }}/{{ dotfiles_user_configs.clone_dir }}/{{ file.src }}"
  become: "{{ item.0.user != ansible_user }}"
  become_user: "{{ item.0.user if item.0.user != ansible_user else omit }}"
  loop: "{{ dotfiles_user_configs.users | subelements('files') }}"
  loop_control:
    label: "{{ user.user }}:{{ file.src }}"
  vars:
    user: "{{ item.0 }}"
    file: "{{ item.1 }}"
    user_home: "{{ item.0.home | default('/home/' + item.0.user) }}"
  register: dotfiles_src_stat

- name: Fail on dotfiles missing from the repo
  ansible.builtin.assert:
    that: missing | length == 0
    fail_msg: >-
      Missing from version '{{ dotfiles_user_configs.version }}' of
      {{ dotfiles_user_configs.repo }}: {{ missing | join(', ') }}
    quiet: true
  vars:
    missing: "{{ dotfiles_src_stat.results | rejectattr('stat.exists') | map(attribute='item.1.src') | list }}"
  when: not ansible_check_mode

- name: Ensure parent directory exists for {{ file.dest }} of {{ user.user }}
  ansible.builtin.file:
    path: "{{ (user_home + '/' + file.dest) | dirname }}"
    state: directory
    owner: "{{ user.user }}"
    group: "{{ user.user }}"
    mode: "0755"
  loop: "{{ dotfiles_user_configs.users | subelements('files') }}"
  loop_control:
    label: "{{ user.user }}:{{ file.dest }}"
  vars:
    user: "{{ item.0 }}"
    file: "{{ item.1 }}"
    user_home: "{{ item.0.home | default('/home/' + item.0.user) }}"
  # A file at the root of the home has the home itself as parent: leave its
  # mode alone (Ubuntu creates it 0750).
  when: file.dest | dirname | length > 0

- name: Create symlink {{ file.src }} -> {{ file.dest }} for {{ user.user }}
  ansible.builtin.file:
    src: "{{ user_home }}/{{ dotfiles_user_configs.clone_dir }}/{{ file.src }}"
    dest: "{{ user_home }}/{{ file.dest }}"
    state: link
    force: true
    owner: "{{ user.user }}"
    group: "{{ user.user }}"
    follow: false
  loop: "{{ dotfiles_user_configs.users | subelements('files') }}"
  loop_control:
    label: "{{ user.user }}:{{ file.src }}"
  vars:
    user: "{{ item.0 }}"
    file: "{{ item.1 }}"
    user_home: "{{ item.0.home | default('/home/' + item.0.user) }}"

- name: Include tmux tasks
  ansible.builtin.include_tasks: tmux.yml
  when: dotfiles_tmux_install | bool
