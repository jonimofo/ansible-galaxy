---
# Paths from the inventory end up in copies and in a delete: refuse anything
# that could leave the home or name the home itself, before any fetch.

- name: Verify clone_dir is a relative path below the home
  ansible.builtin.assert:
    that:
      - _clone_dir is string
      - _clone_dir | length > 0
      - _clone_dir is not match('/')
      - (_clone_dir | normpath) != '.'
      - "'..' not in _clone_dir.split('/')"
    fail_msg: >-
      dotfiles_user_configs.clone_dir must be a non-empty relative path below
      the home, not '.', without '..' and not absolute: '{{ _clone_dir }}'
    quiet: true
  vars:
    _clone_dir: "{{ dotfiles_user_configs.clone_dir }}"

- name: Verify the home of each dotfiles user is absolute
  ansible.builtin.assert:
    that: item.home is not defined or (item.home is string and item.home is match('/'))
    fail_msg: "The home of dotfiles user {{ item.user }} must be an absolute path: '{{ item.home }}'"
    quiet: true
  loop: "{{ dotfiles_user_configs.users }}"
  loop_control:
    label: "{{ item.user }}"

- name: Verify each dotfiles src and dest is a relative path without '..'
  ansible.builtin.assert:
    that:
      - item.1[item.2] is string
      - item.1[item.2] | length > 0
      - item.1[item.2] is not match('/')
      - (item.1[item.2] | normpath) != '.'
      - "'..' not in item.1[item.2].split('/')"
    fail_msg: >-
      dotfiles {{ item.2 }} of user {{ item.0.user }} must be a relative path
      without '..' and not absolute: '{{ item.1[item.2] }}'
    quiet: true
  loop: >-
    {{ dotfiles_user_configs.users | subelements('files', skip_missing=true)
       | product(['src', 'dest']) | map('flatten', levels=1) | list }}
  loop_control:
    label: "{{ item.0.user }}:{{ item.2 }}={{ item.1[item.2] }}"
