---
- name: Check dotfiles sources exist in the checkout
  ansible.builtin.stat:
    path: "{{ _dotfiles_tmp.path }}/{{ item.src }}"
  loop: "{{ _dotfiles_user.files }}"
  loop_control:
    label: "{{ _dotfiles_user.user }}:{{ item.src }}"
  register: dotfiles_src_stat

# An https repo URL can carry user:token@, which must not reach the output.
# Also checked in check mode: the checkout is real there too.
- name: Fail on dotfiles missing from the repo
  ansible.builtin.assert:
    that: missing | length == 0
    fail_msg: >-
      Missing from version '{{ dotfiles_user_configs.version }}' of
      {{ dotfiles_user_configs.repo | regex_replace('//[^@/]+@', '//') }}: {{ missing | join(', ') }}
    quiet: true
  vars:
    missing: "{{ dotfiles_src_stat.results | rejectattr('stat.exists') | map(attribute='item.src') | list }}"
