---
# defaults file for roles/dotfiles

# Each run fetches the listed sources on the host (temporary sparse checkout,
# one commit deep), copies them into the home as regular files owned by the
# user (executable bit kept) and deletes the checkout: no clone and no symlink
# stay on the host. A symlink at dest is replaced by the file, its target is
# not touched. A file edited by hand on the host is overwritten on the next run.
# In check mode the fetch runs for real (it only touches the temporary
# checkout), so --check --diff shows the per-file diffs and a missing source.

# dotfiles_user_configs: Dotfiles repository and per-user file mappings.
# With an empty users list the role does nothing.
dotfiles_user_configs:
  repo: ""
  version: "main"
  clone_dir: ".dotfiles"
  users: []
# Example:
# dotfiles_user_configs:
#   repo: 'git@github.com:example/dotfiles.git'
#   version: 'main'          # branch, tag or commit; fetched one commit deep
#   clone_dir: '.dotfiles'   # relative to the home: location of a pre-3.0 clone
#                            # to clean up. Deleted when it is a clean clone of
#                            # repo; kept with a warning when it has uncommitted
#                            # changes or unpushed commits; any other folder
#                            # there is left alone.
#   users:
#     - user: user
#       home: '/home/user'   # optional, defaults to /home/<user>
#       files:
#         - src: '.bashrc'
#           dest: '.bashrc'
#         - src: '.bash_aliases'
#           dest: '.bash_aliases'
#         - src: '.inputrc'
#           dest: '.inputrc'
#         # TMUX
#         - src: '.tmux.conf'
#           dest: '.tmux.conf'
#         - src: 'tmux/powerline-config.sh'
#           dest: '.config/tmux-powerline/config.sh'
#         # GIT
#         - src: '.git-completion.bash'
#           dest: '.git-completion.bash'
#         - src: '.gitconfig'
#           dest: '.gitconfig'

# dotfiles_verify_ssh_access: Before fetching over SSH, check that the forwarded
# agent has a key (ssh-add -l) and that the repo host accepts it. Only applies
# to ssh repo URLs (user@host:path).
dotfiles_verify_ssh_access: true

# dotfiles_tmux_install: Install tmux, TPM, and plugins for every user in dotfiles_user_configs
dotfiles_tmux_install: false
