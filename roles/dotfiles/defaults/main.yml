---
# defaults file for roles/dotfiles

# dotfiles_user_configs: Dotfiles repository and per-user file mappings.
# With an empty users list the role does nothing.
dotfiles_user_configs:
  repo: ""
  version: "main"
  clone_dir: ".dotfiles"
  users: []
# Example:
# dotfiles_user_configs:
#   repo: 'git@github.com:example/dotfiles.git'
#   version: 'main'          # branch, tag or commit; cloned shallow, single branch
#   clone_dir: '.dotfiles'   # relative to the user's home
#   users:
#     - user: user
#       home: '/home/user'   # optional, defaults to /home/<user>
#       files:
#         - src: '.bashrc'
#           dest: '.bashrc'
#         - src: '.bash_aliases'
#           dest: '.bash_aliases'
#         - src: '.inputrc'
#           dest: '.inputrc'
#         # TMUX
#         - src: '.tmux.conf'
#           dest: '.tmux.conf'
#         - src: 'tmux/powerline-config.sh'
#           dest: '.config/tmux-powerline/config.sh'
#         # GIT
#         - src: '.git-completion.bash'
#           dest: '.git-completion.bash'
#         - src: '.gitconfig'
#           dest: '.gitconfig'

# dotfiles_verify_ssh_access: Before cloning over SSH, check that the forwarded
# agent has a key (ssh-add -l) and that the repo host accepts it. Only applies
# to ssh repo URLs (user@host:path).
dotfiles_verify_ssh_access: true

# dotfiles_tmux_install: Install tmux, TPM, and plugins for users with .tmux.conf symlinked
dotfiles_tmux_install: false
