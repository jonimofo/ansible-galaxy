---
# tasks file for roles/locale

- name: Verify Debian-based system
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "This role only supports Debian-based systems (Debian, Ubuntu)"
    quiet: true

- name: Install locale packages
  ansible.builtin.apt:
    name: "{{ locale_packages }}"
    state: present

- name: Generate locale {{ locale_name }}
  community.general.locale_gen:
    name: "{{ locale_name }}"
    state: present

- name: Generate additional locales
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ locale_additional }}"
  when: locale_additional | length > 0

- name: Set default locale file
  ansible.builtin.copy:
    dest: /etc/default/locale
    content: |
      {% for key, val in locale_env.items() %}{{ key }}={{ val }}
      {% endfor %}
    mode: "0644"
    # /etc/default/locale is a symlink to /etc/locale.conf on Debian/Ubuntu;
    # follow it so we update the real file and report idempotence correctly.
    follow: true
  notify: Reconfigure locales

- name: Ensure LANG in /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^LANG='
    line: "LANG={{ locale_name }}"
    state: present
