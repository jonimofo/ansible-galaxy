---
- name: Configure Debian Server
  hosts: all
  become: true
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
  roles:
    - role: jonimofo.infrastructure.users
      tags: "users"

    - role: jonimofo.infrastructure.ssh
      tags: "ssh"

    - role: jonimofo.infrastructure.ufw
      tags: "ufw"
    - role: jonimofo.infrastructure.fail2ban
      tags: "fail2ban"
    - role: jonimofo.infrastructure.timezone
      tags: "timezone"

    - role: jonimofo.infrastructure.locale
      tags: "locale"

    - role: jonimofo.infrastructure.packages
      tags: "packages"

    - role: jonimofo.infrastructure.host
      tags: "host"

    - role: jonimofo.infrastructure.dotfiles
      tags: "dotfiles"

    - role: jonimofo.infrastructure.fzf
      tags: "fzf"

    - role: jonimofo.infrastructure.lazydocker
      tags: "lazydocker"


    - role: jonimofo.infrastructure.astronvim
      tags: "astronvim"

    # ANSIBLE GALAXY ROLES
    - role: geerlingguy.docker
      tags: docker
